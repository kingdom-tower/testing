name: Chart releaser v1.9.0 pre-release e2e

on:
  push:
    branches: [codex/chart-releaser-v1.9.0-e2e]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    services:
      registry:
        image: registry:2
        ports: [5000:5000]
    env:
      CLI_SOURCE_SHA: 1b43878125bffa089a5c6a7717e9678b1cfae01c
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helm/chart-releaser
          ref: ${{ env.CLI_SOURCE_SHA }}
          path: .e2e/cli
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cpanato/chart-releaser-action
          ref: de4404428afc09778fc49f6960d123871fea600c
          path: .e2e/action
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .e2e/cli/go.mod
          cache-dependency-path: .e2e/cli/go.sum
      - name: Build pinned pre-release CLI into the v1.9.0 tool cache
        working-directory: .e2e/cli
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TOOL_CACHE/cr/v1.9.0/$(uname -m)"
          mkdir -p "$install_dir"
          go build -ldflags "-X github.com/helm/chart-releaser/cr/cmd.Version=v1.9.0-dev -X github.com/helm/chart-releaser/cr/cmd.GitCommit=$CLI_SOURCE_SHA" -o "$install_dir/cr" ./cr
          "$install_dir/cr" version
      - name: Verify installation using the new default
        uses: ./.e2e/action
        with:
          install_only: true
      - name: Prepare isolated publishing branch and chart versions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chart-releaser e2e'
          git config user.email 'chart-releaser-e2e@users.noreply.github.com'
          pages_branch="e2e/cr-v1.9.0-$GITHUB_RUN_ID"
          empty_tree=$(git hash-object -t tree --stdin </dev/null)
          pages_commit=$(printf 'Initialize isolated e2e index\n' | git commit-tree "$empty_tree")
          git push origin "$pages_commit:refs/heads/$pages_branch"
          git fetch origin "$pages_branch:refs/remotes/origin/$pages_branch"
          echo "PAGES_BRANCH=$pages_branch" >> "$GITHUB_ENV"
          echo "CHART_VERSION=1.9.0-e2e.$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          for chart in charts/*; do
            sed -i "s/^version:.*/version: 1.9.0-e2e.$GITHUB_RUN_ID/" "$chart/Chart.yaml"
          done
      - name: Package, release, publish index, and push OCI charts
        id: release
        uses: ./.e2e/action
        with:
          packages_with_index: true
          pages_branch: ${{ env.PAGES_BRANCH }}
          oci_registry_url: oci://localhost:5000/cr-v1.9
          mark_as_latest: false
        env:
          CR_TOKEN: ${{ github.token }}
          CR_PLAIN_HTTP: 'true'
      - name: Verify published packages, index digests, OCI tags, and outputs
        env:
          CHANGED_CHARTS: ${{ steps.release.outputs.changed_charts }}
        shell: bash
        run: |
          set -euo pipefail
          cr version --json | jq -e --arg sha "$CLI_SOURCE_SHA" '.Version == "v1.9.0-dev" and .GitCommit == $sha'
          test "$CHANGED_CHARTS" = 'charts/cr-v190-alpha,charts/cr-v190-beta'
          git fetch origin "$PAGES_BRANCH:refs/remotes/origin/$PAGES_BRANCH"
          git show "origin/$PAGES_BRANCH:index.yaml" > "$RUNNER_TEMP/e2e-index.yaml"
          for chart in cr-v190-alpha cr-v190-beta; do
            package="$chart-$CHART_VERSION.tgz"
            gh release download "$chart-$CHART_VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$package" --dir "$RUNNER_TEMP/release-assets"
            cmp ".cr-release-packages/$package" "$RUNNER_TEMP/release-assets/$package"
            git show "origin/$PAGES_BRANCH:$package" > "$RUNNER_TEMP/$package"
            cmp ".cr-release-packages/$package" "$RUNNER_TEMP/$package"
            digest=$(sha256sum ".cr-release-packages/$package" | cut -d ' ' -f 1)
            grep -F "$digest" "$RUNNER_TEMP/e2e-index.yaml"
            grep -F "$package" "$RUNNER_TEMP/e2e-index.yaml"
            curl -fsS "http://localhost:5000/v2/cr-v1.9/$chart/tags/list" | jq -e --arg version "$CHART_VERSION" '.tags | index($version) != null'
            curl -fsS -H 'Accept: application/vnd.oci.image.manifest.v1+json' "http://localhost:5000/v2/cr-v1.9/$chart/manifests/$CHART_VERSION" | jq -e '.schemaVersion == 2 and .config.mediaType == "application/vnd.cncf.helm.config.v1+json"'
          done
          {
            echo 'Validated with upstream source, not official v1.9.0 release artifacts.'
            echo "CLI source: $CLI_SOURCE_SHA"
            echo 'Action source: de4404428afc09778fc49f6960d123871fea600c'
            echo "Chart version: $CHART_VERSION"
            echo "Index branch: $PAGES_BRANCH"
            echo 'Passed: install-only, two-chart packaging, release assets, branch packages, index digests, OCI tags/manifests, changed_charts output.'
          } >> "$GITHUB_STEP_SUMMARY"
